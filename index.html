<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkRvbid0Rm9yZ2V0IiwKICAic2hvcnRfbmFtZSI6ICJEb24ndEZvcmdldCIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjRjRGNkY4IiwKICAidGhlbWVfY29sb3IiOiAiIzRGNDZFNSIsCiAgImljb25zIjogW3sKICAgICJzcmMiOiAiaHR0cHM6Ly9jZG4taWNvbnMtcG5nLmZsYXRpY29uLmNvbS81MTIvMTgyOC8xODI4ODg0LnBuZyIsCiAgICAic2l6ZXMiOiAiMTkyeDE5MiIsCiAgICAidHlwZSI6ICJpbWFnZS9wbmciCiAgfV0KfQ==">
  <title>Don'tForget</title>
  <style>
    :root { --bg-color: #f4f6f8; --card-bg: #ffffff; --text-color: #1f2937; --secondary-text: #6b7280; --header-bg: #4F46E5; --input-bg: #ffffff; --border-color: #d1d5db; }
    body.dark-mode { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; --secondary-text: #a0a0a0; --header-bg: #312e81; --input-bg: #2d2d2d; --border-color: #444444; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background 0.3s, color 0.3s; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 70px; }
    header { background: var(--header-bg); color: white; padding: 18px; text-align: center; font-size: 20px; font-weight: bold; position: relative; }
    #theme-toggle { position: absolute; right: 15px; top: 15px; background: none; border: none; font-size: 20px; cursor: pointer; color: white; }
    .container { padding: 16px; max-width: 500px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: var(--card-bg); padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 16px; text-align: left; }
    label { font-size: 14px; font-weight: 600; color: var(--text-color); display: block; margin-top: 12px; margin-bottom: 4px; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 15px; background: var(--input-bg); color: var(--text-color); }
    .btn-primary { background: #4F46E5; color: white; border: none; font-weight: bold; margin-top: 18px; cursor: pointer; }
    .btn-support { background: #ec4899; color: white; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; padding: 15px; }
    .item-card { background: var(--card-bg); padding: 14px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-left: 5px solid #4F46E5; display: flex; justify-content: space-between; align-items: center; }
    .item-card.completed { border-left-color: #10B981; opacity: 0.7; }
    .action-btns { display: flex; gap: 6px; }
    .btn-icon { width: 36px; height: 36px; border: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
    .btn-done { background: #e0e7ff; color: #4338ca; }
    .btn-delete { background: #fee2e2; color: #dc2626; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); display: flex; border-top: 1px solid var(--border-color); height: 60px; z-index: 100; }
    nav button { flex: 1; border: none; background: none; font-size: 11px; color: var(--secondary-text); font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    nav button.active { color: #4F46E5; }
    #tutorial-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 24px; text-align: center; }
    .slide { display: none; width: 100%; max-width: 350px; margin: auto; }
    .slide.active { display: flex; flex-direction: column; align-items: center; }
    .slide img { width: 130px; height: 130px; margin-bottom: 24px; }
    .tutorial-controls { width: 100%; max-width: 350px; }
    .btn-next { background: #4F46E5; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; }
    .btn-finish { background: #10B981; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; }
    #toast { visibility: hidden; min-width: 220px; background-color: #1f2937; color: #fff; text-align: center; border-radius: 25px; padding: 12px 20px; position: fixed; z-index: 1000; left: 50%; bottom: 75px; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; }
    #toast.show { visibility: visible; opacity: 1; }
  </style>
</head>
<body>

  <!-- TUTORIAL -->
  <div id="tutorial-overlay">
    <div style="flex:1; display:flex; align-items:center; width:100%;">
      <div id="slide1" class="slide active">
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png">
        <h2>Don'tForget</h2>
        <p>Tus recordatorios siempre a mano.</p>
      </div>
      <div id="slide2" class="slide">
        <img src="https://cdn-icons-png.flaticon.com/512/447/447031.png">
        <h2>Ubicación</h2>
        <p>Activa el GPS para recordatorios por lugar.</p>
      </div>
      <div id="slide3" class="slide">
        <img src="https://cdn-icons-png.flaticon.com/512/6195/6195699.png">
        <h2>Permisos</h2>
        <p>Al iniciar, daremos permisos de notificación y ubicación.</p>
      </div>
    </div>
    <div class="tutorial-controls">
      <button id="nextBtn" class="btn-next" onclick="nextSlide()">Siguiente</button>
      <button id="finishBtn" class="btn-finish" style="display:none;" onclick="finishTutorial()">¡Empezar!</button>
    </div>
  </div>

  <header>Don'tForget<button id="theme-toggle" onclick="toggleTheme()">🌙</button></header>

  <div class="container">
    <div id="sec-anotar" class="tab-content active">
      <div class="card">
        <h2>📝 Nueva Nota</h2>
        <input type="text" id="taskText" placeholder="¿Qué olvidarás?">
        <select id="triggerType" onchange="toggleInputs()">
          <option value="hora">⏰ Por Hora</option>
          <option value="ubicacion">📍 Por Ubicación</option>
        </select>
        <div id="group-time"><label>Fecha y Hora:</label><input type="datetime-local" id="taskTime"></div>
        <div id="group-location" style="display:none;"><label>Lugar:</label><select id="selectLocation"></select></div>
        <button class="btn-primary" onclick="saveTask()">¡Guardar!</button>
      </div>
    </div>
    <div id="sec-notas" class="tab-content"><h2>📋 Mis Recordatorios</h2><div id="notesContainer"></div></div>
    <div id="sec-lugares" class="tab-content">
      <div class="card">
        <h2>📍 Guardar Lugar</h2>
        <input type="text" id="locNameInput" placeholder="Nombre">
        <button class="btn-primary" style="background:#10B981;" onclick="addCurrentLocation()">Guardar ubicación actual</button>
      </div>
      <div id="placesContainer"></div>
    </div>
    <div id="sec-apoya" class="tab-content"><div class="card" style="text-align:center;"><h2>❤️ Apoya</h2><button class="btn-support" onclick="showRewardedAd()">Ver video de apoyo</button></div></div>
  </div>

  <div id="toast"></div>

  <nav>
    <button id="btn-tab-anotar" class="active" onclick="switchTab('anotar')">📝 Anotar</button>
    <button id="btn-tab-notas" onclick="switchTab('notas')">📋 Notas</button>
    <button id="btn-tab-lugares" onclick="switchTab('lugares')">📍 Lugares</button>
    <button id="btn-tab-apoya" onclick="switchTab('apoya')">❤️ Apoya</button>
  </nav>

  <script>
    // --- INTEGRACIÓN SERVICE WORKER (Para Notificaciones Android) ---
    const swBlob = new Blob([`self.addEventListener('notificationclick', (event) => { event.notification.close(); });`], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register(swUrl);

    // --- LÓGICA ---
    if (localStorage.getItem('tutorialSeen')) document.getElementById('tutorial-overlay').style.display = 'none';

    function nextSlide() {
      document.getElementById(`slide${currentSlide}`).classList.remove('active');
      currentSlide++;
      document.getElementById(`slide${currentSlide}`).classList.add('active');
      if(currentSlide === 3) { document.getElementById('nextBtn').style.display='none'; document.getElementById('finishBtn').style.display='block'; }
    }
    let currentSlide = 1;

    function finishTutorial() {
      if ("Notification" in window) Notification.requestPermission();
      localStorage.setItem('tutorialSeen', 'true');
      document.getElementById('tutorial-overlay').style.display = 'none';
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      document.getElementById('theme-toggle').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    let tasks = JSON.parse(localStorage.getItem('df_tasks')) || [];
    let places = JSON.parse(localStorage.getItem('df_places')) || [];

    // MOTOR ALARMAS
    setInterval(() => {
      const now = new Date();
      tasks.forEach(t => {
        if(t.completed) return;
        // Hora
        if(t.type === 'hora' && t.time && now >= new Date(t.time)) { triggerAlarm(t); }
        // Ubicación
        if(t.type === 'ubicacion' && t.place) {
          navigator.geolocation.getCurrentPosition(pos => {
            if(getDistance(pos.coords.latitude, pos.coords.longitude, t.place.lat, t.place.lng) <= 50) triggerAlarm(t);
          });
        }
      });
    }, 10000);

    async function triggerAlarm(task) {
      // 1. Notificación NATIVA (Android System Tray)
      if ('serviceWorker' in navigator && Notification.permission === 'granted') {
        const registration = await navigator.serviceWorker.ready;
        registration.showNotification("Don'tForget 🔔", {
          body: task.text,
          icon: 'https://cdn-icons-png.flaticon.com/512/1828/1828884.png',
          vibrate: [200, 100, 200],
          tag: 'task-' + task.id
        });
      }
      
      showToast("🔔 Recordatorio: " + task.text);
      task.completed = true;
      localStorage.setItem('df_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function toggleInputs() {
      const type = document.getElementById('triggerType').value;
      document.getElementById('group-time').style.display = type === 'hora' ? 'block' : 'none';
      document.getElementById('group-location').style.display = type === 'ubicacion' ? 'block' : 'none';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(`sec-${tab}`).classList.add('active');
      document.getElementById(`btn-tab-${tab}`).classList.add('active');
      if(tab === 'notas') renderTasks();
      if(tab === 'lugares') renderPlaces();
      if(tab === 'anotar') updateLocationDropdown();
    }

    function showToast(msg) {
      const t = document.getElementById("toast"); t.innerText = msg; t.className = "show";
      setTimeout(() => { t.className = ""; }, 3000);
    }

    function addCurrentLocation() {
      navigator.geolocation.getCurrentPosition(pos => {
        const name = document.getElementById('locNameInput').value || "Mi ubicación";
        places.push({ id: Date.now(), name, lat: pos.coords.latitude, lng: pos.coords.longitude });
        localStorage.setItem('df_places', JSON.stringify(places));
        showToast("📍 Ubicación guardada");
        renderPlaces();
      });
    }

    function renderPlaces() {
      document.getElementById('placesContainer').innerHTML = places.map(p => `
        <div class="item-card"><div><strong>📍 ${p.name}</strong></div><button onclick="deletePlace(${p.id})">🗑️</button></div>`).join('');
    }

    function deletePlace(id) {
      places = places.filter(p => p.id !== id); localStorage.setItem('df_places', JSON.stringify(places)); renderPlaces();
    }

    function updateLocationDropdown() {
      document.getElementById('selectLocation').innerHTML = places.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    function saveTask() {
      const text = document.getElementById('taskText').value;
      const time = document.getElementById('taskTime').value;
      const type = document.getElementById('triggerType').value;
      let place = (type === 'ubicacion') ? places.find(p => p.id == document.getElementById('selectLocation').value) : null;
      tasks.push({ id: Date.now(), text, time, type, place, completed: false });
      localStorage.setItem('df_tasks', JSON.stringify(tasks));
      showToast("✨ Nota guardada");
      switchTab('notas');
    }

    function renderTasks() {
      document.getElementById('notesContainer').innerHTML = tasks.map(t => `
        <div class="item-card ${t.completed ? 'completed' : ''}">
          <div><strong>${t.text}</strong><br><small>${t.type === 'hora' ? t.time.replace('T', ' ') : 'Ubicación: ' + (t.place ? t.place.name : '')}</small></div>
          <button onclick="deleteTask(${t.id})">🗑️</button>
        </div>`).join('');
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id); localStorage.setItem('df_tasks', JSON.stringify(tasks)); renderTasks();
    }

    updateLocationDropdown();
  </script>
</body>
</html>
